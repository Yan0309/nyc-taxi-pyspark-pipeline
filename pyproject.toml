[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-taxi-spark-pipeline"
version = "1.0.0"
description = "A partitioned PySpark pipeline for NYC TLC yellow-taxi data"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pyspark==3.5.5"]

[project.scripts]
taxi-pipeline = "taxi_pipeline.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
